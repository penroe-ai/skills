name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: References match shared/
        run: node scripts/sync-references.mjs --check
      - name: Skills and manifests
        run: node scripts/validate.mjs
